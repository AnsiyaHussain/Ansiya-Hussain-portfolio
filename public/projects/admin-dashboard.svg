<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Browser Frame -->
  <g transform="translate(40, 30)">
    <rect width="720" height="440" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))"/>
    
    <!-- Top Bar -->
    <rect width="720" height="36" rx="12" fill="#1e293b"/>
    <rect y="24" width="720" height="12" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="80" y="8" width="400" height="20" rx="6" fill="#0f172a"/>
    <text x="96" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">https://admin.cicadarise.io/dashboard</text>

    <!-- Sidebar Left -->
    <g transform="translate(0, 36)">
      <rect width="160" height="404" fill="#1e293b"/>
      <line x1="160" y1="0" x2="160" y2="404" stroke="#334155" stroke-width="1"/>
      
      <text x="20" y="32" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="900" font-size="14">ERP ADMIN</text>

      <rect x="12" y="52" width="136" height="32" rx="6" fill="#0284c7"/>
      <text x="36" y="72" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="11">Dashboard</text>

      <text x="36" y="116" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Products</text>
      <text x="36" y="152" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Orders</text>
      <text x="36" y="188" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Customers</text>
      <text x="36" y="224" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Analytics</text>
      <text x="36" y="260" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Settings</text>
    </g>

    <!-- Main Content Right -->
    <g transform="translate(180, 52)">
      <!-- Top Stat Cards -->
      <g transform="translate(0, 0)">
        <!-- Stat 1 -->
        <rect width="160" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Total Revenue</text>
        <text x="16" y="50" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="800" font-size="18">$48,290</text>
        <text x="100" y="50" fill="#4ade80" font-family="'Inter', sans-serif" font-weight="700" font-size="10">+12.4%</text>

        <!-- Stat 2 -->
        <rect x="176" y="0" width="160" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="192" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Total Orders</text>
        <text x="192" y="50" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="800" font-size="18">1,420</text>
        <text x="276" y="50" fill="#4ade80" font-family="'Inter', sans-serif" font-weight="700" font-size="10">+8.1%</text>

        <!-- Stat 3 -->
        <rect x="352" y="0" width="160" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="368" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Active Users</text>
        <text x="368" y="50" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="800" font-size="18">892</text>
        <text x="452" y="50" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="700" font-size="10">+24.0%</text>
      </g>

      <!-- Analytics Graph Box -->
      <g transform="translate(0, 90)">
        <rect width="512" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="28" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Monthly Revenue Trend</text>

        <!-- Grid Lines -->
        <line x1="16" y1="60" x2="496" y2="60" stroke="#334155" stroke-width="0.5"/>
        <line x1="16" y1="95" x2="496" y2="95" stroke="#334155" stroke-width="0.5"/>
        <line x1="16" y1="130" x2="496" y2="130" stroke="#334155" stroke-width="0.5"/>

        <!-- Line Chart Path -->
        <path d="M20 120 Q 80 90, 140 105 T 260 60 T 380 75 T 490 40" fill="none" stroke="url(#chartLine)" stroke-width="3"/>
        <circle cx="490" cy="40" r="5" fill="#38bdf8"/>
      </g>

      <!-- Recent Transactions Table -->
      <g transform="translate(0, 256)">
        <rect width="512" height="116" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="11">Recent Orders</text>
        
        <!-- Table Header -->
        <rect x="12" y="32" width="488" height="24" rx="4" fill="#0f172a"/>
        <text x="24" y="48" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">ORDER ID</text>
        <text x="140" y="48" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">CUSTOMER</text>
        <text x="280" y="48" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">AMOUNT</text>
        <text x="400" y="48" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">STATUS</text>

        <!-- Table Row 1 -->
        <text x="24" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">#ORD-9482</text>
        <text x="140" y="74" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10">Sarah Jenkins</text>
        <text x="280" y="74" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10">$249.00</text>
        <rect x="400" y="64" width="60" height="16" rx="8" fill="#166534"/>
        <text x="430" y="75" fill="#4ade80" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle">Completed</text>

        <!-- Table Row 2 -->
        <text x="24" y="98" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">#ORD-9481</text>
        <text x="140" y="98" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10">Alex Rivera</text>
        <text x="280" y="98" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10">$580.50</text>
        <rect x="400" y="88" width="60" height="16" rx="8" fill="#854d0e"/>
        <text x="430" y="99" fill="#fde047" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle">Processing</text>
      </g>
    </g>
  </g>
</svg>
