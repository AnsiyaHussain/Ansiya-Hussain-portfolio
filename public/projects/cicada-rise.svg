<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
  <path d="M200 0 V500 M400 0 V500 M600 0 V500" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Main Window Frame -->
  <g transform="translate(40, 30)">
    <rect width="720" height="440" rx="12" fill="#ffffff" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))"/>
    
    <!-- Browser Top Bar -->
    <rect width="720" height="36" rx="12" fill="#0f172a"/>
    <rect y="24" width="720" height="12" fill="#0f172a"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="80" y="8" width="400" height="20" rx="6" fill="#1e293b"/>
    <text x="96" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">https://cicadarise.store/catalog</text>

    <!-- Header / Navbar inside mockup -->
    <rect x="0" y="36" width="720" height="48" fill="#ffffff"/>
    <line x1="0" y1="84" x2="720" y2="84" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="66" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="800" font-size="16">CICADA RISE</text>
    <rect x="180" y="52" width="220" height="24" rx="12" fill="#f1f5f9"/>
    <text x="195" y="68" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Search products, brands...</text>
    <rect x="630" y="52" width="66" height="24" rx="6" fill="url(#accent)"/>
    <text x="663" y="68" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">Cart (3)</text>

    <!-- Hero Banner -->
    <g transform="translate(24, 98)">
      <rect width="672" height="110" rx="10" fill="url(#accent)"/>
      <text x="24" y="44" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="20">Summer Tech &amp; Fashion Collection</text>
      <text x="24" y="68" fill="#dbeafe" font-family="'Inter', sans-serif" font-size="12">Up to 40% Off on Selected Django Powered Goods</text>
      <rect x="24" y="78" width="100" height="22" rx="4" fill="#ffffff"/>
      <text x="74" y="93" fill="#2563eb" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">Shop Now →</text>
    </g>

    <!-- Product Grid Cards -->
    <g transform="translate(24, 224)">
      <!-- Product Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="190" rx="8" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="12" y="12" width="186" height="96" rx="6" fill="#e2e8f0"/>
        <circle cx="105" cy="60" r="22" fill="#94a3b8"/>
        <text x="12" y="126" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Wireless Pro Headphones</text>
        <text x="12" y="144" fill="#2563eb" font-family="'Inter', sans-serif" font-weight="800" font-size="14">$149.00</text>
        <rect x="12" y="154" width="186" height="24" rx="4" fill="#0f172a"/>
        <text x="105" y="170" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Product Card 2 -->
      <g transform="translate(231, 0)">
        <rect width="210" height="190" rx="8" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="12" y="12" width="186" height="96" rx="6" fill="#dbeafe"/>
        <rect x="75" y="36" width="60" height="48" rx="4" fill="#3b82f6"/>
        <text x="12" y="126" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Smart Watch Series X</text>
        <text x="12" y="144" fill="#2563eb" font-family="'Inter', sans-serif" font-weight="800" font-size="14">$299.00</text>
        <rect x="12" y="154" width="186" height="24" rx="4" fill="#0f172a"/>
        <text x="105" y="170" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Add to Cart</text>
      </g>

      <!-- Product Card 3 -->
      <g transform="translate(462, 0)">
        <rect width="210" height="190" rx="8" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="12" y="12" width="186" height="96" rx="6" fill="#fef3c7"/>
        <polygon points="105,30 130,80 80,80" fill="#f59e0b"/>
        <text x="12" y="126" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Minimalist Leather Pack</text>
        <text x="12" y="144" fill="#2563eb" font-family="'Inter', sans-serif" font-weight="800" font-size="14">$89.00</text>
        <rect x="12" y="154" width="186" height="24" rx="4" fill="#0f172a"/>
        <text x="105" y="170" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Add to Cart</text>
      </g>
    </g>
  </g>
</svg>
