<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="hotelGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Browser Frame -->
  <g transform="translate(40, 30)">
    <rect width="720" height="440" rx="12" fill="#fafaf9" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))"/>
    
    <!-- Top Bar -->
    <rect width="720" height="36" rx="12" fill="#1c1917"/>
    <rect y="24" width="720" height="12" fill="#1c1917"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="80" y="8" width="400" height="20" rx="6" fill="#292524"/>
    <text x="96" y="22" fill="#a8a29e" font-family="'Inter', sans-serif" font-size="11">https://grandhaven.hotel/management</text>

    <!-- Header -->
    <rect x="0" y="36" width="720" height="52" fill="#ffffff"/>
    <line x1="0" y1="88" x2="720" y2="88" stroke="#e7e5e4" stroke-width="1"/>
    <text x="24" y="68" fill="#1c1917" font-family="'Inter', sans-serif" font-weight="800" font-size="16">GRAND HAVEN HOTEL</text>
    <text x="220" y="68" fill="#78716c" font-family="'Inter', sans-serif" font-size="11">Rooms &bull; Reservations &bull; Guests &bull; Billing</text>
    <rect x="590" y="50" width="106" height="26" rx="6" fill="url(#hotelGold)"/>
    <text x="643" y="67" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="10" text-anchor="middle">+ New Booking</text>

    <!-- Content Split -->
    <!-- Left Sidebar Menu -->
    <g transform="translate(24, 102)">
      <rect width="180" height="314" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
      <text x="16" y="28" fill="#a8a29e" font-family="'Inter', sans-serif" font-weight="700" font-size="10">QUICK STATS</text>
      
      <rect x="12" y="40" width="156" height="60" rx="6" fill="#fef3c7"/>
      <text x="24" y="60" fill="#92400e" font-family="'Inter', sans-serif" font-size="11">Occupancy Rate</text>
      <text x="24" y="84" fill="#b45309" font-family="'Inter', sans-serif" font-weight="800" font-size="20">88.4%</text>

      <rect x="12" y="112" width="156" height="60" rx="6" fill="#ecfdf5"/>
      <text x="24" y="132" fill="#065f46" font-family="'Inter', sans-serif" font-size="11">Active Bookings</text>
      <text x="24" y="156" fill="#047857" font-family="'Inter', sans-serif" font-weight="800" font-size="20">42 Rooms</text>

      <rect x="12" y="184" width="156" height="60" rx="6" fill="#eff6ff"/>
      <text x="24" y="204" fill="#1e40af" font-family="'Inter', sans-serif" font-size="11">Today Check-ins</text>
      <text x="24" y="228" fill="#1d4ed8" font-family="'Inter', sans-serif" font-weight="800" font-size="20">14 Guests</text>
    </g>

    <!-- Right Main Grid Rooms -->
    <g transform="translate(220, 102)">
      <!-- Room Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="232" height="150" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
        <rect x="12" y="12" width="208" height="70" rx="6" fill="#e7e5e4"/>
        <text x="12" y="102" fill="#1c1917" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Deluxe Ocean Suite #301</text>
        <text x="12" y="118" fill="#78716c" font-family="'Inter', sans-serif" font-size="10">King Bed &bull; Sea View</text>
        <rect x="156" y="94" width="64" height="20" rx="10" fill="#dcfce7"/>
        <text x="188" y="108" fill="#15803d" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle">Booked</text>
      </g>

      <!-- Room Card 2 -->
      <g transform="translate(244, 0)">
        <rect width="232" height="150" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
        <rect x="12" y="12" width="208" height="70" rx="6" fill="#fef3c7"/>
        <text x="12" y="102" fill="#1c1917" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Executive Suite #405</text>
        <text x="12" y="118" fill="#78716c" font-family="'Inter', sans-serif" font-size="10">2 Queen Beds &bull; Balcony</text>
        <rect x="156" y="94" width="64" height="20" rx="10" fill="#fef9c3"/>
        <text x="188" y="108" fill="#a16207" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle">Available</text>
      </g>

      <!-- Room Card 3 -->
      <g transform="translate(0, 164)">
        <rect width="232" height="150" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
        <rect x="12" y="12" width="208" height="70" rx="6" fill="#eff6ff"/>
        <text x="12" y="102" fill="#1c1917" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Penthouse Villa #501</text>
        <text x="12" y="118" fill="#78716c" font-family="'Inter', sans-serif" font-size="10">Private Pool &bull; Butler</text>
        <rect x="156" y="94" width="64" height="20" rx="10" fill="#dcfce7"/>
        <text x="188" y="108" fill="#15803d" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle">Booked</text>
      </g>

      <!-- Room Card 4 -->
      <g transform="translate(244, 164)">
        <rect width="232" height="150" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1"/>
        <rect x="12" y="12" width="208" height="70" rx="6" fill="#fae8ff"/>
        <text x="12" y="102" fill="#1c1917" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Royal Suite #402</text>
        <text x="12" y="118" fill="#78716c" font-family="'Inter', sans-serif" font-size="10">Panoramic View &bull; Spa</text>
        <rect x="156" y="94" width="64" height="20" rx="10" fill="#fee2e2"/>
        <text x="188" y="108" fill="#b91c1c" font-family="'Inter', sans-serif" font-weight="700" font-size="9" text-anchor="middle">Cleaning</text>
      </g>
    </g>
  </g>
</svg>
